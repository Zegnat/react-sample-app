name: Deploy to GitHub Pages

on:
  push:
    branches: [upgraded]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check

  diff:
    name: Detect changed deploy targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages_changed: ${{ steps.diff.outputs.pages_changed }}
      docker_changed: ${{ steps.diff.outputs.docker_changed }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Diff build inputs against the last deployed commit
        id: diff
        run: |
          set -euo pipefail
          common=(':!.github' ':!*.md' ':!Wireframes' ':!e2e'
                  ':!playwright.config.ts' ':!playwright.docker.config.mts'
                  ':!scripts' ':!eslint.config.mjs' ':!upgrade-images.mjs'
                  ':!vite.config.mts' ':!Dockerfile')
          pages_excludes=("${common[@]}" ':!Dockerfile.ci')
          docker_excludes=("${common[@]}")

          changed_since() {
            local ref="$1"; shift
            if ! git fetch --depth=1 origin "$ref" >/dev/null 2>&1; then
              REPLY=true; return
            fi
            if git diff --quiet FETCH_HEAD HEAD -- . "$@"; then
              REPLY=false
            else
              REPLY=true
            fi
          }

          changed_since refs/deploy/pages "${pages_excludes[@]}"
          pages_changed="$REPLY"
          changed_since refs/deploy/docker "${docker_excludes[@]}"
          docker_changed="$REPLY"
          {
            echo "pages_changed=$pages_changed"
            echo "docker_changed=$docker_changed"
          } >> "$GITHUB_OUTPUT"
          echo "pages_changed=$pages_changed docker_changed=$docker_changed"

  react:
    name: Test the React runtime (parity)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright
        # No --with-deps: ubuntu-latest already ships every shared library headless
        # Chromium needs (libnss3, libgbm1, libatk*, libasound2, …); --with-deps only
        # adds CJK/Cyrillic fonts (~21 MB, ~11s) these Latin-text DOM tests never use.
        run: npx playwright install chromium
      - name: Test the React runtime against the Vite dev server
        env:
          E2E_TARGET: react
        run: npx playwright test --project=react

  build:
    name: Build the production bundle
    needs: [checks, diff]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for the bundle SBOM attestation
      attestations: write # record the deployment-artifact SBOM attestation
    steps:
      - name: Checkout your repository using git
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        env:
          COMMIT_HASH: ${{ steps.checkout.outputs.commit }}
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright
        # No --with-deps: ubuntu-latest already ships every shared library headless
        # Chromium needs (libnss3, libgbm1, libatk*, libasound2, …); --with-deps only
        # adds CJK/Cyrillic fonts (~21 MB, ~11s) these Latin-text DOM tests never use.
        run: npx playwright install chromium
      - name: Test production build (Preact preview)
        run: npx playwright test --project=preact
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - name: Upload licenses
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: dist/LICENSES.txt
          retention-days: 90
      - name: Package Pages artifact
        if: needs.diff.outputs.pages_changed == 'true'
        run: tar --dereference --hard-dereference --directory ./dist --exclude=LICENSES.txt -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Attest SBOM for the deployment artifact
        if: needs.diff.outputs.pages_changed == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: github-pages-bundle
          subject-path: ${{ runner.temp }}/artifact.tar
          sbom-path: sbom.cdx.json
      - name: Upload Pages artifact
        if: needs.diff.outputs.pages_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Upload dist for the Docker image
        if: needs.diff.outputs.docker_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1

  pages:
    name: Deploy to Pages
    needs: [react, build, diff]
    if: needs.diff.outputs.pages_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write # advance refs/deploy/pages after a successful deploy
      pages: write # deploy the built site to GitHub Pages
      id-token: write # OIDC token for the Pages deploy
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - name: Record this commit as the last Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method PATCH "repos/$REPO/git/refs/deploy/pages" -f sha="$SHA" -F force=true \
            || gh api --method POST "repos/$REPO/git/refs" -f ref="refs/deploy/pages" -f sha="$SHA"

  docker:
    name: Build, test & publish Docker image
    needs: [react, build, diff]
    if: needs.diff.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # advance refs/deploy/docker after a successful publish
      packages: write # push the image to the GitHub Container Registry
      id-token: write # OIDC token for the image attestations
      attestations: write # record image provenance and the image SBOM
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the pre-built dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build Docker image
        run: docker buildx build --load -t sws-ci -f Dockerfile.ci --cache-from type=gha --cache-to type=gha,mode=max .
      - name: Start container
        run: docker run -d --rm --name sws-ci -p 4173:80 sws-ci
      - name: Smoke test the container
        run: |
          ok=false
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && { ok=true; break; }
            sleep 1
          done
          [ "$ok" = true ] || { echo "container never became ready"; docker logs sws-ci; exit 1; }
          asset="$(grep -oE 'src="\./assets/[^"]*"' dist/index.html | sed 's/src="\.\///;s/"//')"
          [ -n "$asset" ] || { echo "no hashed asset found in dist/index.html"; exit 1; }
          curl -sf "http://localhost:4173/$asset" >/dev/null || { echo "asset $asset not served at root"; docker logs sws-ci; exit 1; }
      - name: Stop container
        if: always()
        run: docker rm -f sws-ci
      - name: Log in to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish image to the GitHub Container Registry
        id: push
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          docker tag sws-ci "$image:$SHA"
          docker tag sws-ci "$image:latest"
          docker push "$image:$SHA"
          docker push "$image:latest"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$SHA" | cut -d@ -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance for the image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM (OS layer)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: sws-ci
          format: cyclonedx-json
          output-file: image.sbom.cdx.json
          upload-artifact: false
      - name: Attest the image SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: image.sbom.cdx.json
          push-to-registry: true
      - name: Record this commit as the last Docker publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api --method PATCH "repos/$REPO/git/refs/deploy/docker" -f sha="$SHA" -F force=true \
            || gh api --method POST "repos/$REPO/git/refs" -f ref="refs/deploy/docker" -f sha="$SHA"
