name: Deploy to GitHub Pages

on:
  push:
    branches: [upgraded]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies
        run: npm audit
      - name: Verify dependency signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check

  pages:
    name: Build & deploy to Pages
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout your repository using git
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        env:
          COMMIT_HASH: ${{ steps.checkout.outputs.commit }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Test production build (Preact preview)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npx playwright test --project=preact
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
      - name: Upload licenses
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: licenses
          path: dist/LICENSES.txt
          retention-days: 90
      - name: Package artifact
        run: tar --dereference --hard-dereference --directory ./dist --exclude=LICENSES.txt -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Attest SBOM for the deployment artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/artifact.tar
          sbom-path: sbom.cdx.json
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  docker:
    name: Build, test & publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Build Docker image
        run: docker build -t sws-e2e .
      - name: Start container
        run: docker run -d --rm --name sws-e2e -p 4173:80 sws-e2e
      - name: Run e2e tests against the container
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          npx playwright test --config=playwright.docker.config.mts
      - name: Stop container
        if: always()
        run: docker rm -f sws-e2e
      - name: Log in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish image to the GitHub Container Registry
        run: |
          image="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker tag sws-e2e "$image:${{ github.sha }}"
          docker tag sws-e2e "$image:latest"
          docker push "$image:${{ github.sha }}"
          docker push "$image:latest"
